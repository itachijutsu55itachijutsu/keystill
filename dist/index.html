<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151918"><meta name="description" content="Practice toward your target typing speed with timed passages, personal mistake drills and downloadable results."><title>Keystill — Typing practice</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true">▥</span> Keystill</div><nav><button id="studio" class="active">Practice</button><button id="past">History</button></nav></header>
<main><section id="practice"><div class="intro"><div><h1>Typing studio<span>.</span></h1><p id="subtitle">Build a steady rhythm, one passage at a time.</p></div><label>Target speed <select id="goal"><option>30 WPM</option><option>40 WPM</option><option>60 WPM</option><option>80 WPM</option></select></label></div>
<div class="panel"><div class="bar"><b id="round">Timed practice</b><div id="times" aria-label="Test duration"><button data-sec="60">1 min</button><button data-sec="180" aria-pressed="true">3 min</button><button data-sec="300">5 min</button></div></div><div class="field" id="field"><div id="lines" aria-hidden="true"></div><textarea aria-label="Type the displayed passage" aria-describedby="accessible" id="entry" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea></div><span class="sr" id="accessible"></span><div class="foot"><span id="status">Click the passage and start typing</span><button id="restart">↻ Restart</button></div></div>
<div class="metrics"><div><small>Time left</small><strong id="clock">3:00</strong></div><div><small>Typing speed</small><strong><span id="speed">0</span> <em>WPM</em></strong></div><div><small>Accuracy</small><strong id="accuracy">—</strong></div></div><div id="out" hidden><h2 id="summary"></h2><div class="actions"><button id="again">New test</button><button id="drill">Practice missed words</button><button id="download">Download result</button></div></div>
<div class="keyboard" aria-hidden="true" id="keyboard"></div></section><section hidden id="history"><h1>Your history<span>.</span></h1><p>Completed sessions saved on this device.</p><div id="records"></div></section></main><footer><span>Keystill</span><span>On-device typing practice</span></footer><script src="app.js"></script></body></html>
